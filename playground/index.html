<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHR.ts Playground</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel-bg: #181825;
    --surface: #252536;
    --border: #313244;
    --text: #cdd6f4;
    --text-dim: #6c7086;
    --accent: #89b4fa;
    --accent-hover: #74c7ec;
    --green: #a6e3a1;
    --red: #f38ba8;
    --yellow: #f9e2af;
    --orange: #fab387;
    --purple: #cba6f7;
    --radius: 8px;
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header h1 span { color: var(--accent); }
  .header .logo { font-size: 22px; }
  .header-controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .header-controls select, .header-controls button {
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-ui);
  }
  .header-controls select:hover, .header-controls button:hover {
    border-color: var(--accent);
  }
  .header-controls button.primary {
    background: var(--accent);
    color: #111;
    font-weight: 600;
    border-color: var(--accent);
  }
  .header-controls button.primary:hover {
    background: var(--accent-hover);
  }
  .header-controls label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
  }
  .header-controls input[type="checkbox"] {
    accent-color: var(--accent);
  }

  /* Main Layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Panels */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-left {
    width: 50%;
    border-right: 1px solid var(--border);
  }
  .panel-right {
    flex: 1;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .panel-header .badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 99px;
    background: var(--surface);
    color: var(--text-dim);
  }

  /* Editor */
  .editor-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .editor-container textarea {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    tab-size: 2;
    white-space: pre;
    overflow: auto;
  }
  .editor-container textarea::placeholder {
    color: var(--text-dim);
  }
  .line-numbers {
    position: absolute;
    top: 0;
    left: 0;
    padding: 16px 10px 16px 0;
    text-align: right;
    color: var(--text-dim);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.6;
    user-select: none;
    opacity: 0.5;
    pointer-events: none;
  }

  /* Constraint Input */
  .constraint-section {
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .constraint-input-area {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    align-items: center;
  }
  .constraint-input-area input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    outline: none;
  }
  .constraint-input-area input:focus {
    border-color: var(--accent);
  }
  .constraint-input-area input::placeholder {
    color: var(--text-dim);
  }
  .constraint-btn {
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--green);
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    white-space: nowrap;
  }
  .constraint-btn:hover {
    border-color: var(--green);
  }

  /* Output Tabs */
  .output-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--panel-bg);
  }
  .output-tab {
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .output-tab:hover { color: var(--text); }
  .output-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .output-tab .count {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 99px;
    font-size: 10px;
    background: var(--surface);
    color: var(--text-dim);
  }

  /* Output Content */
  .output-content {
    flex: 1;
    overflow: auto;
    padding: 16px;
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.7;
  }
  .output-content pre {
    white-space: pre-wrap;
    word-break: break-all;
  }
  .output-section {
    display: none;
  }
  .output-section.active {
    display: block;
  }

  /* Store Table */
  .store-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .store-table th {
    text-align: left;
    padding: 6px 12px;
    border-bottom: 2px solid var(--border);
    color: var(--text-dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .store-table td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font);
  }
  .store-table tr:hover td {
    background: var(--surface);
  }
  .id-col { color: var(--text-dim); width: 50px; }
  .name-col { color: var(--accent); }
  .args-col { color: var(--green); }
  .empty-state {
    color: var(--text-dim);
    font-style: italic;
    padding: 20px;
    text-align: center;
  }

  /* Traces */
  .trace-item {
    padding: 8px 12px;
    margin-bottom: 4px;
    border-radius: 6px;
    background: var(--surface);
    font-size: 12px;
    line-height: 1.5;
  }
  .trace-item .label {
    font-weight: 600;
    color: var(--yellow);
  }
  .trace-item .op-propagation  { color: var(--accent); }
  .trace-item .op-simplification { color: var(--orange); }
  .trace-item .op-simpagation  { color: var(--purple); }
  .trace-item .bindings { color: var(--green); font-size: 11px; }
  .trace-item .duration { color: var(--text-dim); font-size: 11px; }
  .trace-item .ids { color: var(--text-dim); font-size: 11px; }

  /* Error */
  .error-box {
    padding: 12px 16px;
    border-radius: 6px;
    background: rgba(243, 139, 168, 0.1);
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    font-family: var(--font);
  }
  .error-box .label {
    font-weight: 600;
    font-family: var(--font-ui);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .success-box {
    padding: 12px 16px;
    border-radius: 6px;
    background: rgba(166, 227, 161, 0.1);
    border: 1px solid var(--green);
    color: var(--green);
    font-size: 13px;
    line-height: 1.5;
    font-family: var(--font);
  }
  .success-box .label {
    font-weight: 600;
    font-family: var(--font-ui);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }

  /* Validation Status Bar */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 16px;
    background: var(--panel-bg);
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .status-bar .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-bar .dot.ready { background: var(--green); }
  .status-bar .dot.error { background: var(--red); }
  .status-bar .dot.running { background: var(--yellow); animation: pulse 0.8s ease-in-out infinite; }
  .status-bar .dot.empty { background: var(--text-dim); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Resize Handle */
  .resize-handle {
    width: 4px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    transition: background 0.15s;
  }
  .resize-handle:hover, .resize-handle.active {
    background: var(--accent);
  }

  /* Responsive */
  @media (max-width: 768px) {
    .main { flex-direction: column; }
    .panel-left { width: 100% !important; border-right: none; max-height: 50vh; }
    .panel-right { flex: 1; }
    .header { flex-direction: column; gap: 8px; align-items: stretch; }
    .header-controls { justify-content: center; }
    .resize-handle { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span class="logo">⚡</span>
    CHR.ts <span>Playground</span>
  </h1>
  <div class="header-controls">
    <select id="exampleSelect" title="Load example">
      <option value="">📂 Load Example...</option>
      <option value="banking">Banking</option>
      <option value="calendar">Calendar</option>
      <option value="ecommerce">E-Commerce</option>
      <option value="education">Education</option>
      <option value="finance">Finance</option>
      <option value="gaming">Gaming</option>
      <option value="healthcare">Healthcare</option>
      <option value="hr">HR</option>
      <option value="inventory">Inventory</option>
      <option value="iot">IoT</option>
      <option value="library">Library</option>
      <option value="logistics">Logistics</option>
      <option value="music">Music</option>
      <option value="smarthome">Smart Home</option>
      <option value="social">Social</option>
      <option value="sports">Sports</option>
      <option value="supplychain">Supply Chain</option>
      <option value="travel">Travel</option>
      <option value="weather">Weather</option>
    </select>
    <label>
      <input type="checkbox" id="builtinsToggle" checked>
      Builtins
    </label>
    <label>
      <input type="checkbox" id="autoRunToggle">
      Auto-run
    </label>
    <button id="runBtn" class="primary">▶ Run</button>
    <button id="clearBtn">✕ Clear</button>
  </div>
</div>

<div class="main">
  <!-- Left Panel: Editor -->
  <div class="panel panel-left" id="leftPanel">
    <div class="panel-header">
      <span>Rules (*.chr)</span>
      <span class="badge" id="lineCount">0 lines</span>
    </div>
    <div class="editor-container">
      <textarea id="editor" spellcheck="false" placeholder="; Write CHR rules here...
; Example:
;   constraint edge/2, path/2.
;   path(X,Y) \ edge(X,Y) ==> path(X,Y).
;   path(X,Z) \ path(X,Y), edge(Y,Z) ==> path(X,Z).
;
; Then type constraints below and click Run."></textarea>
    </div>
    <div class="constraint-section">
      <div class="panel-header" style="border-top: none;">
        <span>Constraints to Assert</span>
        <span class="badge">one per line: name(args)</span>
      </div>
      <div class="constraint-input-area">
        <input id="constraintInput" type="text" placeholder='e.g. edge(1,2), edge(2,3), path(1,2)' 
               title="Comma-separated constraints to assert"/>
        <button id="assertResetBtn" class="constraint-btn" title="Assert these constraints (clears previous store)">⟳ Reset & Assert</button>
      </div>
    </div>
  </div>

  <!-- Resize Handle -->
  <div class="resize-handle" id="resizeHandle"></div>

  <!-- Right Panel: Output -->
  <div class="panel panel-right">
    <div class="panel-header">
      <span>Output</span>
      <span class="badge" id="storeCount">0 constraints</span>
    </div>

    <div class="output-tabs">
      <div class="output-tab active" data-tab="store">Store</div>
      <div class="output-tab" data-tab="traces">Traces <span class="count" id="traceCount">0</span></div>
      <div class="output-tab" data-tab="errors">Errors</div>
      <div class="output-tab" data-tab="source">AST</div>
    </div>

    <div class="output-content" id="outputContent">
      <!-- Store tab -->
      <div class="output-section active" id="tab-store">
        <div class="empty-state">Run rules to see the constraint store state.</div>
      </div>
      <!-- Traces tab -->
      <div class="output-section" id="tab-traces">
        <div class="empty-state">No rule firings yet.</div>
      </div>
      <!-- Errors tab -->
      <div class="output-section" id="tab-errors">
        <div class="empty-state">No errors.</div>
      </div>
      <!-- Source tab -->
      <div class="output-section" id="tab-source">
        <div class="empty-state">Parsed AST will appear here.</div>
      </div>
    </div>
  </div>
</div>

<div class="status-bar">
  <span class="dot ready" id="statusDot"></span>
  <span id="statusText">Ready</span>
  <span style="flex:1"></span>
  <span id="firingCount">Firings: 0</span>
</div>

<script src="./chrts-bundle.js"></script>
<script>

// ============================================================
// DOM refs
// ============================================================
const editor = document.getElementById('editor');
const constraintInput = document.getElementById('constraintInput');
const runBtn = document.getElementById('runBtn');
const clearBtn = document.getElementById('clearBtn');
const assertResetBtn = document.getElementById('assertResetBtn');
const exampleSelect = document.getElementById('exampleSelect');
const builtinsToggle = document.getElementById('builtinsToggle');
const autoRunToggle = document.getElementById('autoRunToggle');
const lineCount = document.getElementById('lineCount');
const storeCount = document.getElementById('storeCount');
const traceCount = document.getElementById('traceCount');
const firingCount = document.getElementById('firingCount');
const statusText = document.getElementById('statusText');
const statusDot = document.getElementById('statusDot');
const outputContent = document.getElementById('outputContent');

// ============================================================
// Engine State
// ============================================================
let engine = null;
let traces = [];
let currentError = null;
let engineState = 'empty';

// ============================================================
// Tab switching
// ============================================================
document.querySelectorAll('.output-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.output-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.output-section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    const section = document.getElementById('tab-' + tab.dataset.tab);
    if (section) section.classList.add('active');
  });
});

// ============================================================
// Line count
// ============================================================
editor.addEventListener('input', () => {
  const lines = editor.value.split('\n').length;
  lineCount.textContent = lines + ' lines';
});

// ============================================================
// Editor storage
// ============================================================
// Restore last session
const saved = localStorage.getItem('chrts-editor');
if (saved) editor.value = saved;
editor.addEventListener('input', () => {
  localStorage.setItem('chrts-editor', editor.value);
});

// ============================================================
// Set status
// ============================================================
function setStatus(state, message) {
  engineState = state;
  statusDot.className = 'dot ' + state;
  statusText.textContent = message;
}

// ============================================================
// Build and run engine
// ============================================================
async function runEngine(assertNewOnly = false) {
  const source = editor.value.trim();
  if (!source) {
    setStatus('empty', 'No rules loaded');
    return;
  }

  traces = [];
  currentError = null;
  const useBuiltins = builtinsToggle.checked;

  try {
    setStatus('running', 'Parsing...');

    // Validate syntax first
    const program = parseProgram(source);
    
    setStatus('running', 'Initializing engine...');

    engine = new BrowserCHREngine({
      onRuleFired: (trace) => {
        traces.push(trace);
        updateTraces();
      },
      maxRuleFirings: 5000
    });

    if (useBuiltins) {
      engine.registerBuiltins();
    }

    // Register all examples' host functions automatically
    registerExampleHosts(engine);

    engine.addProgram(program);

    setStatus('running', 'Engine ready. Asserting constraints...');

    // Parse constraint input
    const constraintText = constraintInput.value.trim();
    if (constraintText) {
      const constraints = parseConstraintInput(constraintText);
      if (constraints.length > 0) {
        await engine.assertMany(constraints);
      }
    } else {
      // If no constraints, run fixpoint on empty store (just validates)
      setStatus('ready', 'Engine loaded. Add constraints and run.');
    }

    // Display results
    displayStore();
    updateTraces();
    displaySourceAST(program);
    updateCounts();

    if (engine.getState() === 'error') {
      setStatus('error', 'Engine entered error state');
    } else {
      setStatus('ready', `Done — ${engine.store.size()} constraints in store`);
    }

  } catch (err) {
    console.error('Engine error:', err);
    currentError = err;
    displayError(err);
    setStatus('error', err.message.split('\n')[0]);
  }
}

// ============================================================
// Parse constraint input
// ============================================================
function parseConstraintInput(text) {
  // Format: name1(arg1, arg2), name2(arg1), ...
  // Also supports: name
  const entries = [];
  let depth = 0;
  let current = '';
  let inQuote = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuote) {
      current += ch;
      if (ch === "'" || ch === '"') inQuote = false;
      continue;
    }
    if (ch === "'" || ch === '"') { inQuote = true; current += ch; continue; }
    if (ch === '(' || ch === '[') { depth++; current += ch; continue; }
    if (ch === ')' || ch === ']') { depth--; current += ch; continue; }
    if (ch === ',' && depth === 0) {
      const trimmed = current.trim();
      if (trimmed) entries.push(trimmed);
      current = '';
      continue;
    }
    current += ch;
  }
  const last = current.trim();
  if (last) entries.push(last);

  return entries.map(entry => {
    // Try to parse as name(args)
    const m = entry.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*\((.*)\)\s*$/);
    if (m) {
      const name = m[1];
      const argsStr = m[2].trim();
      const args = argsStr ? parseConstraintArgs(argsStr) : [];
      return { name, args };
    }
    // No args
    if (/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(entry)) {
      return { name: entry, args: [] };
    }
    throw new Error(`Invalid constraint: "${entry}". Use format: name(arg1, arg2) or name`);
  });
}

function parseConstraintArgs(text) {
  const args = [];
  let depth = 0;
  let current = '';
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '(' || ch === '[') { depth++; current += ch; continue; }
    if (ch === ')' || ch === ']') { depth--; current += ch; continue; }
    if (ch === ',' && depth === 0) {
      args.push(parseArgValue(current.trim()));
      current = '';
      continue;
    }
    current += ch;
  }
  const last = current.trim();
  if (last) args.push(parseArgValue(last));
  return args;
}

function parseArgValue(str) {
  // Try number
  if (/^-?\d+(\.\d+)?$/.test(str)) return Number(str);
  // Try boolean
  if (str === 'true') return true;
  if (str === 'false') return false;
  if (str === 'null') return null;
  // Try string (quoted)
  if ((str.startsWith("'") && str.endsWith("'")) || (str.startsWith('"') && str.endsWith('"'))) {
    return str.slice(1, -1);
  }
  // Treat as string literal
  return str;
}

// ============================================================
// Register host functions for examples
// ============================================================
function registerExampleHosts(engine) {
  // Host functions used across all 19 examples
  engine.registerHost({
    functions: {
      // banking
      balance: (_ctx, ...args) => args[0] ?? 0,
      eligible: (_ctx, ...args) => 1,
      overdrawn: (_ctx, ...args) => 0,
      interest: (_ctx, ...args) => 0,
      // calendar
      overlaps: (_ctx, ...args) => true,
      priority: (_ctx, ...args) => 1,
      duration: (_ctx, ...args) => args[0] ?? 0,
      is_urgent: (_ctx, ...args) => 1,
      // ecommerce
      total: (_ctx, ...args) => args[0] ?? 0,
      apply_disc: (_ctx, ...args) => args[0] ?? 0,
      is_valid: (_ctx, ...args) => true,
      in_stock: (_ctx, ...args) => true,
      rating: (_ctx, ...args) => 5,
      // education
      gpa: (_ctx, ...args) => args[0] ?? 3,
      passed: (_ctx, ...args) => true,
      is_fulltime: (_ctx, ...args) => true,
      grade_avg: (_ctx, ...args) => args[0] ?? 80,
      due_soon: (_ctx, ...args) => true,
      // finance
      value: (_ctx, ...args) => args[0] ?? 0,
      is_risky: (_ctx, ...args) => 1,
      returns: (_ctx, ...args) => args[0] ?? 0,
      liquid: (_ctx, ...args) => true,
      appreciates: (_ctx, ...args) => true,
      // gaming
      level: (_ctx, ...args) => args[0] ?? 1,
      is_win: (_ctx, ...args) => true,
      bonus: (_ctx, ...args) => args[0] ?? 10,
      rarity: (_ctx, ...args) => 1,
      power: (_ctx, ...args) => args[0] ?? 10,
      // healthcare
      urgent: (_ctx, ...args) => 1,
      follow_up: (_ctx, ...args) => true,
      refill: (_ctx, ...args) => true,

// ============================================================
// Display store
// ============================================================
function displayStore() {
  const container = document.getElementById('tab-store');
  if (!engine || engine.store.size() === 0) {
    container.innerHTML = '<div class="empty-state">No constraints in store.</div>';
    return;
  }
  
  const snapshot = engine.store.snapshot();
  let html = '<table class="store-table"><thead><tr><th class="id-col">#</th><th class="name-col">Constraint</th><th>Args</th></tr></thead><tbody>';
  for (const entry of snapshot) {
    const argsStr = entry.arity === 0 ? '' : entry.args.map(a => formatArg(a)).join(', ');
    const nameStr = entry.arity === 0 ? entry.name : `${entry.name}`;
    html += `<tr><td class="id-col">${entry.id}</td><td class="name-col">${nameStr}</td><td class="args-col">${argsStr}</td></tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function formatArg(arg) {
  if (typeof arg === 'string') return `'${arg}'`;
  if (arg === null) return 'null';
  return String(arg);
}

// ============================================================
// Display traces
// ============================================================
function updateTraces() {
  const container = document.getElementById('tab-traces');
  traceCount.textContent = traces.length;
  firingCount.textContent = `Firings: ${traces.length}`;

  if (traces.length === 0) {
    container.innerHTML = '<div class="empty-state">No rule firings yet.</div>';
    return;
  }

  let html = traces.slice().reverse().map((t, i) => {
    const kindClass = `op-${t.kind}`;
    const kindLabel = t.kind === 'propagation' ? '==>' : t.kind === 'simplification' ? '<=>' : '\\ <=>';
    const bindingsStr = Object.entries(t.bindings).map(([k, v]) => `${k}=${formatArg(v)}`).join(', ');
    const durationStr = t.durationMs ? `${t.durationMs.toFixed(1)}ms` : '';
    return `<div class="trace-item">
      <div>
        <span class="label">${t.ruleName}</span>
        <span class="${kindClass}"> ${kindLabel} </span>
        <span class="ids">[#${t.matchedConstraintIds.join(', #')}]</span>
        ${durationStr ? `<span class="duration"> (${durationStr})</span>` : ''}
      </div>
      ${bindingsStr ? `<div class="bindings">${bindingsStr}</div>` : ''}
    </div>`;
  }).join('');
  
  container.innerHTML = html;
}

// ============================================================
// Display error
// ============================================================
function displayError(err) {
  const container = document.getElementById('tab-errors');
  container.innerHTML = `<div class="error-box">
    <div class="label">⚠ Error</div>
    ${escapeHtml(err.message)}
  </div>`;
}

// ============================================================
// Display source AST
// ============================================================
function displaySourceAST(program) {
  const container = document.getElementById('tab-source');
  const lines = [];
  lines.push('// Declarations');
  for (const d of program.declarations) {
    lines.push(`constraint ${d.name}/${d.arity};`);
  }
  for (const d of program.functionDeclarations) {
    lines.push(`function ${d.name}/${d.arity};`);
  }
  for (const d of program.actionDeclarations) {
    lines.push(`action ${d.name}/${d.arity};`);
  }
  for (const d of program.hostImports) {
    lines.push(`import host ${d.name};`);
  }
  lines.push('');
  lines.push('// Rules');
  for (const r of program.rules) {
    const name = r.name ?? '(anonymous)';
    const kind = r.kind === 'propagation' ? '==>' : r.kind === 'simplification' ? '<=>' : '\\ <=>';
    const kept = r.kept.map(c => c.name + '(' + c.args.map(a => exprToString(a)).join(',') + ')').join(', ');
    const removed = r.removed.map(c => c.name + '(' + c.args.map(a => exprToString(a)).join(',') + ')').join(', ');
    const guards = r.guard.map(g => exprToString(g)).join(', ');
    const body = r.body.map(b => bodyItemToString(b)).join(', ');
    let ruleStr = '';
    if (r.priority !== undefined) ruleStr += `@${r.priority}@ `;
    if (r.unify) ruleStr += 'unify ';
    if (kept) ruleStr += kept;
    if (r.kind === 'simpagation') ruleStr += ' \\ ';
    if (removed && r.kind !== 'propagation') ruleStr += removed;
    ruleStr += ` ${kind} `;
    if (guards) ruleStr += `${guards} | `;
    ruleStr += body;
    lines.push(`  ${name} @ ${ruleStr};`);
  }
  
  container.innerHTML = `<pre style="color:var(--accent);font-size:12px;">${lines.join('\n')}</pre>`;
}

function exprToString(expr) {
  if (expr.type === 'variable') return expr.name;
  if (expr.type === 'literal') return String(expr.value);
  if (expr.type === 'call') return expr.callee + '(' + expr.args.map(a => exprToString(a)).join(', ') + ')';
  if (expr.type === 'binary') return `(${exprToString(expr.left)} ${expr.operator} ${exprToString(expr.right)})`;
  if (expr.type === 'unary') return expr.operator + exprToString(expr.operand);
  if (expr.type === 'array') return '[' + expr.elements.map(e => exprToString(e)).join(', ') + ']';
  return '?';
}

function bodyItemToString(item) {
  if (item.type === 'constraint') return exprToString({ type: 'call', callee: item.constraint.name, args: item.constraint.args });
  if (item.type === 'action') return '!' + item.name + '(' + item.args.map(a => exprToString(a)).join(', ') + ')';
  if (item.type === 'update') return exprToString({ type: 'call', callee: item.old.name, args: item.old.args }) + ' <= ' + exprToString({ type: 'call', callee: item.constraint.name, args: item.constraint.args });
  if (item.type === 'let') return 'let ' + item.name + ' = ' + exprToString(item.expr);
  return '?';
}

// ============================================================
// Update counts
// ============================================================
function updateCounts() {
  if (engine) {
    storeCount.textContent = engine.store.size() + ' constraints';
  }
}

// ============================================================
// Clear
// ============================================================
function clearAll() {
  engine = null;
  traces = [];
  currentError = null;
  document.getElementById('tab-store').innerHTML = '<div class="empty-state">Run rules to see the constraint store state.</div>';
  document.getElementById('tab-traces').innerHTML = '<div class="empty-state">No rule firings yet.</div>';
  document.getElementById('tab-errors').innerHTML = '<div class="empty-state">No errors.</div>';
  document.getElementById('tab-source').innerHTML = '<div class="empty-state">Parsed AST will appear here.</div>';
  traceCount.textContent = '0';
  firingCount.textContent = 'Firings: 0';
  storeCount.textContent = '0 constraints';
  setStatus('empty', 'Cleared');
}

// ============================================================
// Load example
// ============================================================
function loadExample(name) {
  if (!name) return;
  const example = EXAMPLES[name];
  if (!example) {
    displayError(new Error('Example not found: ' + name));
    return;
  }
  editor.value = example.source;
  localStorage.setItem('chrts-editor', editor.value);
  lineCount.textContent = example.source.split('\n').length + ' lines';
  constraintInput.value = example.hint ?? '';
  if (autoRunToggle.checked) {
    runEngine();
  }
}

exampleSelect.addEventListener('change', () => {
  loadExample(exampleSelect.value);
  exampleSelect.value = '';
});

// ============================================================
// Escape HTML
// ============================================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// Resize panels
// ============================================================
const leftPanel = document.getElementById('leftPanel');
const resizeHandle = document.getElementById('resizeHandle');
let isResizing = false;

resizeHandle.addEventListener('mousedown', (e) => {
  isResizing = true;
  resizeHandle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const pct = (e.clientX / window.innerWidth) * 100;
  const clamped = Math.max(20, Math.min(80, pct));
  leftPanel.style.width = clamped + '%';
});

document.addEventListener('mouseup', () => {
  if (isResizing) {
    isResizing = false;
    resizeHandle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// ============================================================
// Events
// ============================================================
runBtn.addEventListener('click', () => runEngine());
clearBtn.addEventListener('click', clearAll);

assertResetBtn.addEventListener('click', async () => {
  // Re-run everything from scratch
  await runEngine();
});

// Auto-run on editor change
let autoRunTimer = null;
editor.addEventListener('input', () => {
  if (autoRunToggle.checked) {
    clearTimeout(autoRunTimer);
    autoRunTimer = setTimeout(() => runEngine(), 500);
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  // Ctrl+Enter or Cmd+Enter to run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runEngine();
  }
  // Escape to clear
  if (e.key === 'Escape') {
    clearAll();
  }
});

// ============================================================
// Initial state
// ============================================================
setStatus('empty', 'Write CHR rules and click Run, or load an example.');
editor.dispatchEvent(new Event('input'));

// ============================================================
// Auto-run on page load (if there's content)
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  if (editor.value.trim()) {
    if (autoRunToggle.checked) {
      await runEngine();
    }
  }
});
</script>
